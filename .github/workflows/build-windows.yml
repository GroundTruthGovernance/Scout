name: Build Windows executable

on:
  push:
    branches: ["main", "master", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (dev + build extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build Windows executable
        run: pyinstaller packaging/scout.spec --noconfirm

      - name: Upload Scout.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: scout-windows-${{ github.sha }}
          path: dist/Scout/
          retention-days: 14
